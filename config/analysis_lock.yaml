ldsc_reference:
  population: EUR
  source: Zenodo_10515792_S-LDSC-reference-files
  source_url: https://zenodo.org/records/10515792
  ldscore_prefix: data/reference/ldsc/LDscore/LDscore.
  weight_prefix: data/reference/ldsc/weights/weights.hm3_noMHC.
  ldscore_archive_md5: e4352ccf778f296835d73985350a863b
  weight_archive_md5: a98ac0f089ee285177544a3e6e721ca3
  hapmap3_merge_file: data/reference/ldsc/w_hm3.noMHC.snplist
  hapmap3_merge_file_md5: 322099f935d914648fbacd67b61d8864
  hapmap3_no_mhc_snps: 1172116

ldsc_parameters:
  software: LDSC_1.0.1_python3_local_build
  munging_info_min: 0.9
  munging_maf_min: 0.01
  munging_chunksize: 500000
  rg_jackknife_blocks: 200
  rg_two_step_cutoff: 30
  allele_policy: strand_unambiguous_SNPs_only; merge_to_EUR_HM3_noMHC
  coordinate_mapping: unique_exact_EUR_GRCh37_BIM_only

instrument_parameters:
  genome_wide_p: 5.0e-8
  clump_r2: 0.001
  clump_window_kb: 10000
  reference: data/reference/1kg_v3/EUR

multiple_testing:
  method: Benjamini_Hochberg
  phase1a_global_family: all_locked_retinal_x_systemic_pairs
  phase1a_within_retinal_domain_family: each_retinal_domain_across_locked_systemic_pairs

phase1b_admission_rule:
  include_if: FDR_significant_OR_(nominal_P<0.05_and_abs_rg>=0.10)_OR_predefined_biology_priority
  priority_list_frozen_before_rg_review: true
  # Deterministic biology-priority rules declared before Phase 1A is run.
  # These rules are retained for Phase 1B admission even if a pair is not
  # FDR-significant, and are not expanded after seeing Phase 1A estimates.
  predefined_biology_priority:
    - retinal_domain: microvasculature
      systemic_diseases: [sys_cad_nikpay2015, sys_stroke_megastroke2018, sys_t2d_scott2017, sys_ckd_wuttke2019]
      rationale: retinal vascular architecture and cardiometabolic/vascular disease
    - retinal_domain: neuroretina
      systemic_diseases: [sys_ad_kunkle2019, sys_pd_nalls2019_clinical]
      rationale: neuroretinal structure and neurodegenerative disease
    - retinal_domain: outer_retina
      systemic_diseases: [sys_ad_kunkle2019]
      rationale: outer-retinal structure and Alzheimer disease
  no_posthoc_additions: true

mr_plan_frozen_for_later:
  method: IVW_when_eligible
  instrument_p: 5.0e-8
  clumping_r2: 0.001
  clumping_window_kb: 10000
  sensitivity_methods: [weighted_median, MR_Egger, weighted_mode, MR_PRESSO_when_eligible]

coloc_plan_frozen_for_later:
  pp4_threshold: 0.80
  priors_must_be_recorded: true

interpretation_taxonomy:
  driver: reliable_retinal_to_disease_directional_evidence_only
  target: reliable_disease_to_retinal_directional_evidence_only
  bidirectional: reliable_directional_evidence_in_both_directions
  bystander: positive_shared_genetic_evidence_without_reliable_directional_causal_evidence
  unresolved: insufficient_instruments_power_overlap_control_or_method_agreement
  ldsc_only_language: association_or_shared_genetic_architecture_only

analysis_boundary:
  phase0_internal_rg_completed: true
  phase1a_cross_trait_ldsc_allowed: true
  stop_after_phase1a: true
  forbidden_until_new_user_authorisation: [MR, MVMR, colocalisation, LAVA, GSMR, mediation]
