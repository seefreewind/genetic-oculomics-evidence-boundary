    <text style="font: 700 10.5px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start" x="15.1236" y="23.364343" transform="rotate(-0 15.1236 23.364343)">Integrated evidence across human-genetic layers</text>
   </g>
   <g id="text_2">
    <text style="font: 700 6.6px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: middle" x="50.7798" y="44.110739" transform="rotate(-0 50.7798 44.110739)">Evidence layer</text>
   </g>
   <g id="text_3">
    <text style="font: 700 6.6px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: middle" x="131.9967" y="44.110739" transform="rotate(-0 131.9967 44.110739)">Analysed universe</text>
   </g>
   <g id="text_4">
    <text style="font: 700 6.6px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: middle" x="209.2518" y="44.110739" transform="rotate(-0 209.2518 44.110739)">Multiplicity-controlled result</text>
   </g>
   <g id="text_5">
    <text style="font: 700 6.6px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: middle" x="322.1631" y="44.110739" transform="rotate(-0 322.1631 44.110739)">Biological interpretation supported</text>
   </g>
   <g id="text_6">
    <text style="font: 700 6.7px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: middle" x="50.7798" y="75.963726" transform="rotate(-0 50.7798 75.963726)">Genome-wide LDSC</text>
   </g>
   <g id="text_7">
    <text style="fill: #374151; font: 6.1px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: middle" x="131.9967" y="75.81296" transform="rotate(-0 131.9967 75.81296)">112 pairs</text>
   </g>
   <g id="text_8">
    <text style="fill: #374151; font: 6.1px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: middle" x="209.2518" y="75.777218" transform="rotate(-0 209.2518 75.777218)">0 global FDR</text>
   </g>
   <g id="text_9">
    <text style="fill: #374151; font: 6.1px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: middle" x="322.1631" y="75.768163" transform="rotate(-0 322.1631 75.768163)">No broad common-variant correlation signal</text>
   </g>
   <g id="text_10">
    <text style="font: 700 6.7px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: middle" x="50.7798" y="108.352157" transform="rotate(-0 50.7798 108.352157)">Primary HDL-L</text>
   </g>
   <g id="text_11">
    <text style="fill: #374151; font: 6.1px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: middle" x="131.9967" y="108.273477" transform="rotate(-0 131.9967 108.273477)">116,472 blocks / 47 pairs</text>
   </g>
   <g id="text_12">
    <text style="fill: #374151; font: 6.1px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: middle" x="209.2518" y="108.209618" transform="rotate(-0 209.2518 108.209618)">0 global-local FDR</text>
   </g>
   <g id="text_13">
    <text style="fill: #374151; font: 6.1px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: middle" x="322.1631" y="108.200563" transform="rotate(-0 322.1631 108.200563)">No stable block-level sharing under primary model</text>
   </g>
   <g id="text_14">
    <text style="font: 700 6.7px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: middle" x="50.7798" y="140.828526" transform="rotate(-0 50.7798 140.828526)">Native LAVA audit</text>
   </g>
   <g id="text_15">
    <text style="fill: #374151; font: 6.1px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: middle" x="131.9967" y="140.668705" transform="rotate(-0 131.9967 140.668705)">26,639 rows</text>
   </g>
   <g id="text_16">
    <text style="fill: #374151; font: 6.1px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(190.607245 137.396151)">9 native FDR;</text>
    <text style="fill: #374151; font: 6.1px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(181.109831 143.869776)">8 boundary-sensitive</text>
   </g>
   <g id="text_17">
    <text style="fill: #374151; font: 6.1px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(270.63335 137.407016)">Rows require sensitivity interpretation;</text>
    <text style="fill: #374151; font: 6.1px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(293.853858 143.930394)">no stable locus claim</text>
   </g>
   <g id="text_18">
    <text style="font: 700 6.7px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: middle" x="50.7798" y="173.260926" transform="rotate(-0 50.7798 173.260926)">Bidirectional MR</text>
   </g>
   <g id="text_19">
    <text style="fill: #374151; font: 6.1px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: middle" x="131.9967" y="173.101105" transform="rotate(-0 131.9967 173.101105)">224 directions</text>
   </g>
   <g id="text_20">
    <text style="fill: #374151; font: 6.1px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(188.236347 169.884213)">1 FDR-positive;</text>
    <text style="fill: #374151; font: 6.1px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(177.205831 176.336107)">orientation unsupported</text>
   </g>
   <g id="text_21">
    <text style="fill: #374151; font: 6.1px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(292.834014 169.875158)">No validated direction</text>
    <text style="fill: #374151; font: 6.1px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(296.394889 176.327052)">of retinal mediation</text>
   </g>
   <g id="text_22">
    <text style="fill: #4b5563; font: 6.5px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif; text-anchor: start" x="15.1236" y="207.1998" transform="rotate(-0 15.1236 207.1998)">Primary conclusions are based on complete declared families; nominal and unresolved rows remain in the supplement.</text>
   </g>
